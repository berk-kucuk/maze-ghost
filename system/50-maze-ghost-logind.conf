# Maze Ghost: when a Ghost session ends, nothing of it may keep running.
#
# KillOnlyUsers=ghost kills the processes of the Ghost account's sessions at
# logout, and only those: every other account keeps the default (processes
# may outlive the session). UserStopDelaySec=0 stops the Ghost user manager
# the moment the last session ends, which is what triggers the clean-up — with
# the default 10 s delay, logging straight back in would reopen the old
# session's home. It applies to every account; for them it only means their
# user manager is not kept around for 10 s after logout.
[Login]
KillOnlyUsers=ghost
UserStopDelaySec=0
