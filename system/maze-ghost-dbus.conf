<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Maze Ghost: system services that would go to the internet on the Ghost
  account's behalf, as their own user and so outside its Tor-only firewall.
  The Ghost account may not ask them.

    resolve1           name lookups (they would leak every host name)
    GeoClue2           location (it sends nearby Wi-Fi networks to a server)
    PackageKit         package lists and downloads
    Flatpak helper     system-wide Flatpak installs
    fwupd              firmware metadata
    Avahi              mDNS: announces and looks up names on the local network
    ModemManager       SMS, calls and location over the cellular modem
    timesync1          NTP servers of its choosing
    timedate1          the system clock and time zone (they outlive the session)
    BlueZ              pairing: the paired-device list outlives the session
    wpa_supplicant     Wi-Fi without NetworkManager's per-user rules
    CUPS PK helper     adding printers

  The polkit rule (49-maze-ghost.rules) denies the same and more by action.
  NetworkManager stays reachable — Ghost may join a Wi-Fi of its own — and is
  limited by polkit instead.
-->
<busconfig>
  <policy user="ghost">
    <deny send_destination="org.freedesktop.resolve1"/>
    <deny send_destination="org.freedesktop.GeoClue2"/>
    <deny send_destination="org.freedesktop.PackageKit"/>
    <deny send_destination="org.freedesktop.Flatpak.SystemHelper"/>
    <deny send_destination="org.freedesktop.fwupd"/>
    <deny send_destination="org.freedesktop.Avahi"/>
    <deny send_destination="org.freedesktop.ModemManager1"/>
    <deny send_destination="org.freedesktop.timesync1"/>
    <deny send_destination="org.freedesktop.timedate1"/>
    <deny send_destination="org.bluez"/>
    <deny send_destination="fi.w1.wpa_supplicant1"/>
    <deny send_destination="org.opensuse.CupsPkHelper.Mechanism"/>
  </policy>
</busconfig>
