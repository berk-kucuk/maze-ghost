<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Maze Ghost: system services that would go to the internet on the Ghost
  account's behalf, as their own user and so outside its Tor-only firewall.
  The Ghost account may not ask them.

    resolve1           name lookups (they would leak every host name)
    GeoClue2           location (it sends nearby Wi-Fi networks to a server)
    PackageKit         package lists and downloads
    Flatpak helper     system-wide Flatpak installs
    fwupd              firmware metadata
-->
<busconfig>
  <policy user="ghost">
    <deny send_destination="org.freedesktop.resolve1"/>
    <deny send_destination="org.freedesktop.GeoClue2"/>
    <deny send_destination="org.freedesktop.PackageKit"/>
    <deny send_destination="org.freedesktop.Flatpak.SystemHelper"/>
    <deny send_destination="org.freedesktop.fwupd"/>
  </policy>
</busconfig>
